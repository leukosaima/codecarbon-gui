[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codecarbon-agent"
version = "0.1.2"
description = "Sidecar of CodeCarbon Desktop: drives CodeCarbon over a JSON-lines stdin/stdout protocol"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["codecarbon>=3.3", "authlib>=1.2.1", "joserfc>=1.0.0", "requests"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
codecarbon-agent = "codecarbon_agent.__main__:main"

[tool.setuptools]
packages = ["codecarbon_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: runs the real CodeCarbon tracker (set CODECARBON_AGENT_INTEGRATION=1)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "BLE"]
