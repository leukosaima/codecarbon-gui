[package]
name = "codecarbon-desktop"
version = "0.1.6"
description = "Tray / menu-bar app that measures your computer's power and CO2 emissions with CodeCarbon"
authors = ["CodeCarbon contributors"]
license = "MIT"
repository = "https://github.com/mlco2/codecarbon-gui"
edition = "2021"
rust-version = "1.90"

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "codecarbon_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
# Already used by Tauri (its async runtime); we need its timer (restart
# back-off, quit time-outs) and Unix signal handling (graceful quit on SIGTERM).
tokio = { version = "1", features = ["time", "signal", "macros"] }
# History view: CodeCarbon's emissions.csv (parsed by header names) and
# local-time aggregation per day / ISO week / month.
csv = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Tray / menu language when the setting is "system" (English or French).
sys-locale = "0.3"
tauri-plugin-notification = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
# Automatic updates from GitHub Releases (`latest.json` + minisign
# signatures). Only initialised when the build has a real updater public
# key (see `updater.rs`). The relaunch afterwards is `AppHandle::request_restart`
# (all that tauri-plugin-process would add is a JS binding we do not want).
tauri-plugin-updater = "2"
# The updater's version type (already in the tree through it), for our
# "is this release newer?" rule.
semver = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
