name: Release

# Builds the installers for every platform and attaches them to a GitHub
# pre-release. Triggered by pushing a tag `vX.Y.Z` (or manually, which uses
# the version in src-tauri/tauri.conf.json as the tag).
#
# Automatic updates: once the repository has the TAURI_SIGNING_PRIVATE_KEY
# (+ _PASSWORD) secrets, the build also signs the updater files (`.sig`,
# macOS `.app.tar.gz`) and the release gets a `latest.json`. Without them
# it builds exactly the same installers as before. See docs/DEVELOPMENT.md,
# "Enabling automatic updates".

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write      # build provenance attestations (Sigstore)
  attestations: write

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  release:
    name: Release (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # `updater_bundles`: with the signing key. The macOS updater file
          # (`.app.tar.gz`) is only made when the `app` bundle is requested.
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
            updater_bundles: deb,rpm,appimage
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
            updater_bundles: nsis,msi
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
            updater_bundles: app,dmg
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
            updater_bundles: app,dmg
            # cryptography >= 49 ships no Intel-Mac wheel: pip would compile it
            # against Homebrew's OpenSSL, which clashes with Python's own
            # libssl inside the frozen sidecar (ImportError at sign-in).
            pip_constraints: "cryptography<49"
    steps:
      - uses: actions/checkout@v7

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build codecarbon-agent (PyInstaller)
        shell: bash
        env:
          PIP_CONSTRAINTS: ${{ matrix.pip_constraints }}
        run: |
          python -m pip install --upgrade pip
          # Never compile cryptography from source: a missing wheel must fail
          # the build instead of producing a sidecar with clashing OpenSSL libs.
          # PIP_CONSTRAINTS is expanded unquoted on purpose: empty on most
          # targets, one requirement such as "cryptography<49" on Intel Macs.
          python -m pip install --only-binary=cryptography "./agent" pyinstaller $PIP_CONSTRAINTS
          python agent/build.py --target ${{ matrix.target }}
      - name: Self-test the frozen agent
        shell: bash
        run: |
          bin=src-tauri/binaries/codecarbon-agent-${{ matrix.target }}
          if [ "$RUNNER_OS" = "Windows" ]; then bin="$bin.exe"; fi
          "$bin" --selftest

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - run: npm ci

      # Updater files only once the signing key exists: UPDATER_ARGS and
      # INCLUDE_UPDATER are set only when the secret is there. The overlay
      # is a file (not inline JSON) so the same arguments work in bash and
      # pwsh. Without the key the build is exactly what it was before.
      - name: Updater signing (when the TAURI_SIGNING_PRIVATE_KEY secret is set)
        shell: bash
        env:
          HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          pubkey=$(python -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['plugins']['updater']['pubkey'].strip())")
          placeholder=REPLACE_WITH_UPDATER_PUBKEY
          if [ "$HAS_UPDATER_KEY" = "true" ]; then
            if [ -z "$pubkey" ] || [ "$pubkey" = "$placeholder" ]; then
              echo "::error::TAURI_SIGNING_PRIVATE_KEY is set but plugins.updater.pubkey in src-tauri/tauri.conf.json is still the placeholder. Put the public key there (docs/DEVELOPMENT.md)."
              exit 1
            fi
            echo "updater: signing enabled"
            echo "BUNDLES=${{ matrix.updater_bundles }}" >> "$GITHUB_ENV"
            echo "UPDATER_ARGS=--config src-tauri/updater.conf.json" >> "$GITHUB_ENV"
            echo "INCLUDE_UPDATER=true" >> "$GITHUB_ENV"
          else
            if [ -n "$pubkey" ] && [ "$pubkey" != "$placeholder" ]; then
              echo "::warning::tauri.conf.json has an updater public key but the TAURI_SIGNING_PRIVATE_KEY secret is missing: this release has no latest.json, installed apps will not be offered it."
            fi
            echo "updater: no signing key, installers only"
            echo "BUNDLES=${{ matrix.bundles }}" >> "$GITHUB_ENV"
          fi

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Empty until the maintainer adds the secrets; only read by the
          # Tauri CLI when the updater overlay above is in use.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v__VERSION__' }}
          releaseName: "CodeCarbon Desktop ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v__VERSION__' }}"
          releaseBody: |
            Pre-release build of CodeCarbon Desktop.

            **macOS Apple Silicon**: download `CodeCarbon_<version>_aarch64.dmg`, drag the app to Applications. The app is not signed yet: on first launch open *System Settings → Privacy & Security* and click **Open Anyway** (macOS 15+), or right-click the app → *Open* (macOS 14 and older).
            **macOS Intel**: `CodeCarbon_<version>_x64.dmg`, same steps.
            **Windows**: `CodeCarbon_<version>_x64-setup.exe` (SmartScreen: *More info → Run anyway*).
            **Linux**: `.AppImage`, `.deb` or `.rpm`.

            Full instructions: https://github.com/mlco2/codecarbon-gui/blob/main/docs/INSTALL.md
          releaseDraft: false
          prerelease: true
          # latest.json only for signed builds (INCLUDE_UPDATER unset: false).
          includeUpdaterJson: ${{ env.INCLUDE_UPDATER == 'true' }}
          # latest.json's generic `windows-x86_64` entry: the setup.exe the
          # release notes recommend (`-nsis` / `-msi` entries are added too).
          updaterJsonPreferNsis: true
          args: --target ${{ matrix.target }} --bundles ${{ env.BUNDLES }} ${{ env.UPDATER_ARGS }}

      - name: Verify the macOS bundle is signed and its sidecar runs
        if: runner.os == 'macOS'
        run: |
          # What users install is the DMG (Tauri removes the .app once the
          # DMG is packed, unless the updater needs it): inspect the DMG.
          dmg=$(find src-tauri/target -path '*/release/bundle/dmg/*.dmg' -type f | head -1)
          echo "dmg: $dmg"
          mount=$(hdiutil attach -nobrowse -readonly "$dmg" | awk -F'\t' '/\/Volumes\//{print $NF}' | tail -1)
          app=$(find "$mount" -maxdepth 1 -name '*.app' | head -1)
          echo "bundle: $app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -E 'Identifier|Signature|TeamIdentifier|flags'
          codesign --verify --verbose=2 "$app/Contents/MacOS/codecarbon-agent"
          plutil -extract LSUIElement raw "$app/Contents/Info.plist"
          echo "--- sidecar signature flags and entitlements"
          codesign -dv "$app/Contents/MacOS/codecarbon-agent" 2>&1 | grep -E 'flags' || true
          codesign -d --entitlements - "$app/Contents/MacOS/codecarbon-agent" 2>&1 || true
          # macOS 26 refuses the engine's bundled Python without this
          # entitlement (exit code 255 on users' Macs; CI runners do not
          # enforce library validation, so check the signature itself).
          for bin in codecarbon-agent codecarbon-desktop; do
            codesign -d --entitlements - --xml "$app/Contents/MacOS/$bin" 2>/dev/null \
              | grep -q "com.apple.security.cs.disable-library-validation" \
              || { echo "::error::$bin is missing disable-library-validation"; exit 1; }
          done
          echo "entitlement disable-library-validation present on app and engine"
          # Run the sidecar exactly as the installed app does: the binary
          # inside the signed bundle (hardened runtime, Tauri's signature),
          # not the PyInstaller output that the earlier self-test ran.
          echo "--- sidecar from the signed bundle"
          "$app/Contents/MacOS/codecarbon-agent" --version
          "$app/Contents/MacOS/codecarbon-agent" --selftest
          # The whole app, started like Finder starts it, spawning the sidecar.
          scripts/macos-app-smoke.sh "$app"
          hdiutil detach "$mount"
      - name: Collect bundles
        shell: bash
        run: |
          mkdir -p out
          find src-tauri/target -path '*/release/bundle/*' -type f \
            \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.dmg' \
               -o -name '*.exe' -o -name '*.msi' \
               -o -name '*.app.tar.gz' -o -name '*.sig' \) -exec cp {} out/ \;
          ls -la out
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: out/*

  checksums:
    name: SHA256SUMS
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve the tag of a manual run
        if: env.TAG == ''
        run: echo "TAG=v$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")" >> "$GITHUB_ENV"
      # Every asset, including latest.json and the updater `.sig` files.
      - name: Download the release assets and publish their checksums
        run: |
          mkdir assets && cd assets
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" --pattern '*' --skip-existing
          rm -f SHA256SUMS.txt
          sha256sum * | tee SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt -R "$GITHUB_REPOSITORY" --clobber
      # The four build jobs each merge their platform into latest.json: make
      # sure none was lost before the release is promoted to "latest".
      - name: Check latest.json (signed releases)
        env:
          HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          if [ "$HAS_UPDATER_KEY" != "true" ]; then
            echo "no updater signing key: no latest.json expected"
            exit 0
          fi
          python3 - assets/latest.json <<'PY'
          import json, sys
          path = sys.argv[1]
          try:
              platforms = json.load(open(path))["platforms"]
          except (OSError, ValueError, KeyError) as e:
              sys.exit(f"::error::{path}: {e}")
          wanted = ["darwin-aarch64", "darwin-x86_64", "linux-x86_64", "windows-x86_64"]
          missing = [p for p in wanted if p not in platforms]
          print("latest.json platforms:", ", ".join(sorted(platforms)))
          if missing:
              sys.exit(f"::error::latest.json lacks {', '.join(missing)}: re-run the release jobs")
          PY
